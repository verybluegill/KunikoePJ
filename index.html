<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>国声PJ | 11月26日 資料一覧</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; color: #17304b; background: #f5f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: linear-gradient(120deg, #112e53, #28639b); color: white; padding: 64px 24px 56px; }
    .wrap { max-width: 880px; margin: auto; }
    .eyebrow { margin: 0 0 12px; font-size: 13px; letter-spacing: .14em; opacity: .78; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); }
    header p:last-child { margin: 16px 0 0; color: #d9e9fc; }
    main { padding: 36px 24px 64px; }
    h2 { font-size: 20px; margin: 0 0 18px; }
    #list { display: grid; gap: 14px; }
    .item { display: flex; gap: 18px; align-items: center; padding: 22px 24px; background: white; border: 1px solid #e1e8f0; border-radius: 16px; box-shadow: 0 6px 22px #1b426808; text-decoration: none; color: inherit; transition: transform .12s, border-color .12s; overflow-wrap: anywhere; }
    .item:hover, .item:focus-visible { transform: translateY(-2px); border-color: #6da5d8; }
    .symbol { border-radius: 12px; padding: 11px; color: #1f5e9b; background: #e9f3ff; font-size: 22px; }
    .name { flex: 1; font-weight: 700; line-height: 1.55; }
    .arrow { color: #3777b4; font-size: 23px; }
    .note { font-size: 13px; color: #65788d; margin-top: 22px; line-height: 1.7; }
    .status { padding: 22px; border: 1px dashed #b9cadd; border-radius: 14px; background: white; color: #506780; }
    .status a { color: #175e9f; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <h1>国声PJ｜11月26日 資料一覧</h1>
  </div></header>
  <main class="wrap">
    <div id="list"><div class="status">資料を読み込んでいます…</div></div>
  </main>
  <script>
    const label = name => {
      if (name.startsWith("1126国声PJ")) return "課題と提言案まとめ";
      if (name.includes("政策提言一覧") || name.includes("14グループ整理")) return "政策提言案グループ整理";
      if (name.startsWith("20261124")) return "完成スライド構成案";
      return name.replace(/\.html?$/i, "").replace(/_/g, " ");
    };
    const order = name => {
      const title = label(name);
      return ["課題と提言案まとめ", "政策提言案グループ整理", "完成スライド構成案"].indexOf(title) < 0 ? 99 : ["課題と提言案まとめ", "政策提言案グループ整理", "完成スライド構成案"].indexOf(title);
    };
    (async () => {
      const list = document.getElementById("list");
      try {
        const response = await fetch("https://api.github.com/repos/verybluegill/KunikoePJ/contents/", {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error("GitHub API: " + response.status);
        const files = (await response.json())
          .filter(file => file.type === "file" && /\.html?$/i.test(file.name) && file.name.toLowerCase() !== "index.html")
          .sort((a, b) => order(a.name) - order(b.name) || a.name.localeCompare(b.name, "ja"));
        list.replaceChildren();
        if (!files.length) {
          list.innerHTML = '<div class="status">公開できるHTMLファイルがまだありません。</div>';
          return;
        }
        for (const file of files) {
          const link = document.createElement("a");
          link.className = "item";
          link.href = "./" + encodeURIComponent(file.name);
          const symbol = document.createElement("span");
          symbol.className = "symbol";
          symbol.textContent = "▤";
          const title = document.createElement("span");
          title.className = "name";
          title.textContent = label(file.name);
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "↗";
          link.append(symbol, title, arrow);
          list.append(link);
        }
      } catch (error) {
        list.innerHTML = '<div class="status">資料一覧を取得できませんでした。時間をおいて再読み込みするか、<a href="https://github.com/verybluegill/KunikoePJ">GitHub上のファイル一覧</a>をご確認ください。</div>';
      }
    })();
  </script>
</body>
</html>
